name: Linkmortem

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "**.md"

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - id: linkmortem
        uses: ./
        with:
          backboard-api-key: ${{ secrets.BACKBOARD_API_KEY }}
          serpapi-api-key: ${{ secrets.SERPAPI_API_KEY }}
          open-pull-request: ${{ github.event_name != 'pull_request' }}
      - if: github.event_name != 'pull_request' && steps.linkmortem.outputs.ghosts != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.linkmortem.outputs.report }}
          PULL_REQUEST: ${{ steps.linkmortem.outputs.pull-request }}
          PULL_REQUEST_STATUS: ${{ steps.linkmortem.outputs.pull-request-status }}
          TITLE: Linkmortem found dead links
        run: bash scripts/report_issue.sh
