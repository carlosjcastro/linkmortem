name: Linkmortem

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "**.md"

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          backboard-api-key: ${{ secrets.BACKBOARD_API_KEY }}
          serpapi-api-key: ${{ secrets.SERPAPI_API_KEY }}
          open-pull-request: ${{ github.event_name != 'pull_request' }}
          open-issue: ${{ github.event_name != 'pull_request' }}
