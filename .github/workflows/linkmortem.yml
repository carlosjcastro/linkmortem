name: Linkmortem

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "**.md"

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: linkmortem
        uses: ./
        with:
          backboard-api-key: ${{ secrets.BACKBOARD_API_KEY }}
          serpapi-api-key: ${{ secrets.SERPAPI_API_KEY }}
      - if: github.event_name != 'pull_request' && steps.linkmortem.outputs.ghosts != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.linkmortem.outputs.report }}
          TITLE: Linkmortem found dead links
        run: |
          existing=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$REPORT"
          else
            gh issue create --title "$TITLE" --body-file "$REPORT"
          fi
